handlers= java.util.logging.FileHandler

java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.pattern = observer%u.%g.log
java.util.logging.FileHandler.limit = 500000
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tFT%1$tT.%1$tL %4$s %2$s: %5$s%6$s%n

# Limit the message that are printed on the console to INFO and above.
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter


com.seleritycorp.observer.processors.LoggingProcessor.handlers=java.util.logging.ConsoleHandler
